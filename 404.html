<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found, QACyberWatch</title>
<link rel="icon" id="fav" href="demo/icon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Outfit,-apple-system,Segoe UI,sans-serif;background:#060a14;color:#e9eef7;text-align:center;padding:24px}
h1{font-size:3rem;margin:0 0 8px;letter-spacing:-.03em}
p{color:#8c9db8;margin:0 0 22px}
a{display:inline-block;margin:4px;padding:12px 20px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0090ff);color:#fff;font-weight:700;text-decoration:none}
a.ghost{background:#101c30;border:1px solid #1c2f4d;color:#e9eef7}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <p>That page is not part of QACyberWatch.</p>
  <a id="home" href="/">Project site</a>
  <a class="ghost" id="console" href="/demo/">Open the console</a>
</div>
<script>
  // Works both at https://siteq8.github.io/QACyberWatch/ and on the custom domain root.
  var base = location.pathname.indexOf("/QACyberWatch/") === 0 ? "/QACyberWatch/" : "/";
  document.getElementById("home").href = base;
  document.getElementById("console").href = base + "demo/";
  document.getElementById("fav").href = base + "demo/icon.svg";
</script>
</body>
</html>
